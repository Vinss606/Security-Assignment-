# CLO1 & Requirement 3: Network-Level Reverse Proxy & TLS 1.3 Termination (Nginx)
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Suppress Nginx version banner (Information Disclosure mitigation)
    server_tokens off;

    # Network-Level DDoS / Brute-Force Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;

    # Redirect all plaintext HTTP (Port 80) permanently to HTTPS (Port 443)
    server {
        listen 80;
        server_name localhost carevault.local;
        return 301 https://$host$request_uri;
    }

    # Hardened HTTPS Edge Listener
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost carevault.local;

        # X.509 Certificate & Private Key signed by CareVault Root CA
        ssl_certificate     /etc/nginx/certs/carevault-server.crt;
        ssl_certificate_key /etc/nginx/certs/carevault-server.key;
        ssl_trusted_certificate /etc/nginx/certs/carevault-root-ca.crt;

        # Enforce TLS 1.2 & TLS 1.3 ONLY with Forward-Secrecy AEAD Ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers on;
        ssl_session_timeout 10m;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Request Body & Buffer Limits (Buffer Overflow / Slowloris DoS mitigation)
        client_max_body_size 16k;
        client_body_timeout 10s;
        client_header_timeout 10s;
        limit_conn per_ip_conn 20;

        # Edge Defense-in-Depth HTTP Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location ~ ^/(api/auth/|portal/(login|register|mfa)) {
            limit_req zone=auth_zone burst=5 nodelay;
            proxy_pass https://carevault_app:8443;
            proxy_ssl_trusted_certificate /etc/nginx/certs/carevault-root-ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_name localhost;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass https://carevault_app:8443;
            proxy_ssl_trusted_certificate /etc/nginx/certs/carevault-root-ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_name localhost;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}

