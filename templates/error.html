<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareVault — Security Notice ({{ status_code }})</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="shield-icon" aria-hidden="true">&#x1F6E1;</span>
      <div>
        <h1>CareVault Clinical Portal (Python Edition)</h1>
        <p class="subtitle">Zero-Trust RBAC &bull; Safe Error Handling &bull; Correlation-ID Verified</p>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="card mfa-card">
      <h2>HTTP {{ status_code }} &mdash; {{ error_code }}</h2>
      <div class="alert alert-error" role="alert">
        {{ message }}
      </div>
      {% if correlation_id %}
      <p class="muted">Support Reference ID: <code>{{ correlation_id }}</code></p>
      {% endif %}
      <a href="/" class="btn btn-primary link-btn">Return to CareVault Portal</a>
    </div>
  </main>
</body>
</html>
