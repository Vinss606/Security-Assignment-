# CLO1: Network Segmentation & Container Capability Dropping
services:
  nginx_edge:
    image: nginx:1.27-alpine
    container_name: carevault_edge_proxy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../certs:/etc/nginx/certs:ro
    depends_on:
      - carevault_app
    networks:
      - dmz_edge_net
      - internal_app_net
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

  carevault_app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: carevault_secure_app
    environment:
      - APP_ENV=production
      - HTTPS_PORT=8443
      - HTTP_REDIRECT_PORT=8080
    volumes:
      - ../certs:/app/certs:ro
      - carevault_db_vol:/app/data
    # Notice: No host `ports:` published! Python app is strictly unreachable bypassing Nginx WAF/Edge
    networks:
      - internal_app_net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  dmz_edge_net:
    driver: bridge
  internal_app_net:
    driver: bridge
    internal: true

volumes:
  carevault_db_vol:
